spring:
  datasource:
    url: jdbc:h2:mem:sofram_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

sofram:
  security:
    jwt:
      secret: 12345678901234567890123456789012
      expiration-minutes: 120
